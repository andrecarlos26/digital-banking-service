services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-di2win_accounts}
      POSTGRES_USER: ${POSTGRES_USER:-di2win}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-di2win}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-di2win} -d ${POSTGRES_DB:-di2win_accounts}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-di2win_accounts}
      DB_USERNAME: ${POSTGRES_USER:-di2win}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-di2win}
      DAILY_WITHDRAWAL_LIMIT: ${DAILY_WITHDRAWAL_LIMIT:-2000.00}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-America/Sao_Paulo}
      ACCOUNT_AGENCY: ${ACCOUNT_AGENCY:-0001}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
